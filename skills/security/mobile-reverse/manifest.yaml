  skills: []
  commands:
    - frida
    - objection
    - jadx
    - apktool
  environment_variables: []

permissions:
  network: false
  read_files: true
  write_files: false
  execute_commands: true

compatibility:
  adapters: []

evaluation:
  cases: tests/cases.yaml

provenance:
