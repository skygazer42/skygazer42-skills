schema_version: 1

cases:
  - id: beautify-plain-readme
    description: >
      拿到一个只有纯文字的 GitHub 个人主页 README 后，叠加视觉增强，
      不改实质内容。

    must:
      - "先完整读现有 README"
      - "识别现有内容结构"
      - "提出 2-3 种美化方向让用户选"
      - "保留所有原有实质内容"
      - "叠加徽章或统计卡片或排版优化"
      - "展示改动让用户确认"

    must_not:
      - "不改任何实质内容（自我介绍、技能列表、项目说明等）"
      - "不添加收费或需要 API key 的服务"
      - "不一次性堆超过 10 个徽章或 4 张统计卡"

  - id: already-rich-readme
    description: >
      现有 README 已经有丰富视觉元素时，不应强行叠加。

    must:
      - "识别 README 已有较完善的视觉元素"
      - "告知用户现状，问具体想改什么"

    must_not:
      - "强行叠加更多元素导致视觉过载"
      - "去掉已有的好东西来实现'美化'"
