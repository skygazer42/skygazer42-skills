schema_version: 1

cases:
  - id: write-episode
    description: >
      用户要求按已接受的分集地图创作某一集的剧本。

    must:
      - "产出单集卡、因果节拍与可拍摄 Markdown 剧本"
      - "人物声音鲜明、动作可表演、因果清楚"
      - "写作前先核对已接受的契约（分集地图/资产/语言设置）"

    must_not:
      - "剧本与已接受的分集地图/资产冲突"
      - "用模板腔或缺失因果的对白填充节拍"

  - id: normalize-existing-script
    description: >
      用户要求规范化或修订一份既有中文剧本。

    must:
      - "保留原文并按语义差异预览修改"
      - "创作者显式接受后才发布版本"
      - "依赖旧产物标 stale 而不静默覆盖"

    must_not:
      - "未接受就覆盖原剧本"
      - "丢失原文语义差异"
