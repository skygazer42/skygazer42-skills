schema_version: 1

cases:
  - id: quick-assessment
    description: >
      用户提交一部长篇小说并询问是否值得改编。

    must:
      - "先做改编价值快评（题材、结构、人物、市场信号等）"
      - "决定是否值得全量拆解，不值得则说明理由"
      - "产出带章节索引的可追溯分析记录"

    must_not:
      - "不读原文就凭印象下改编结论"
      - "跳过章节/剧情单元索引直接给分集清单"

  - id: extract-candidates
    description: >
      用户要求把原著拆成剧情单元并给出分集候选。

    must:
      - "逐章提取功能、聚合剧情单元与节奏"
      - "归并人物与设定、避免重复实体"
      - "输出带改编价值判定与分集候选，交给开发环节"

    must_not:
      - "分集候选凭空编造、脱离章节证据"
      - "把人物/设定实体重复登记"
