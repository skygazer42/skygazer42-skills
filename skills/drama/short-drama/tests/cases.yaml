schema_version: 1

cases:
  - id: initialize-project
    description: >
      用户要求创建/初始化一个短剧或漫剧项目（如「创建一个短剧项目」）。

    must:
      - "在用户指定工作区初始化文件系统项目（short-drama.json、.short-drama/state.json 等）"
      - "询问或确认语言、画面比例等必要格式项后初始化"
      - "返回清晰的下一步与当前负责技能"

    must_not:
      - "在未确认位置时擅自初始化到任意目录"
      - "代写故事、资产、提示词、分镜或终审结论"

  - id: route-across-stages
    description: >
      用户请求跨多个创作环节、意图不明确（如「帮我把这个剧本做下去」）。

    must:
      - "先读取项目状态判断当前阶段与已接受产物"
      - "把明确的写作/资产/提示词/分镜/审查请求路由给对应子技能"
      - "对不明确请求给出可选方向再继续"

    must_not:
      - "跳过状态判断直接猜测下一步"
      - "在一个技能内代做其他环节的产出"

  - id: recover-interrupted-publish
    description: >
      用户恢复中断或不完整的发布，或要求导出制作资料。

    must:
      - "先做事务恢复（读后写、原子提交）再继续"
      - "交付前用校验和复核候选预览"
      - "未接受版本不进入交付"

    must_not:
      - "静默覆盖创作者外部编辑或依赖产物"
      - "把 provisional/candidate 状态当作已接受交付"
