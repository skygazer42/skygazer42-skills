schema_version: 1

id: engineering.architecture-review
name: Architecture Review
version: 0.1.0
status: beta

description: >
  扫描代码库找「深化机会」——把浅模块变深模块，用 deletion test 判断，
  呈现候选后用 grilling 逐个审问。架构/模块层审查，区别于代码级 code-review。

category: engineering
entrypoint: SKILL.md
tags:
  - engineering
  - architecture
  - code-quality
  - testability

contents:
  examples:
  references:
  scripts:
  tests: tests

dependencies:
  skills:
    - engineering.grilling
  commands:
    - git
  environment_variables: []

permissions:
  network: false
  read_files: true
  write_files: false
  execute_commands: true

compatibility:
  adapters: []

evaluation:
  cases: tests/cases.yaml

provenance:
  file: provenance.yaml
