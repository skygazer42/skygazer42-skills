schema_version: 1

cases:
  - id: typical-closeout-review
    description: >
      用户在提交/发布前要求过一遍变更。autoreview 应把待审变更打包（本地脏改动 /
      branch / commit / PR），先对精确新增/修改/删除内容跑 TruffleHog 密钥扫描，再调用
      默认 Codex 引擎（缺失或不可用时按失败策略处理）在隔离空工作区做结构化审查，输出
      按严重度分级的发现，并且不 push。

    must:
      - "打包待审变更并以 git 快照交给审查"
      - "先用 TruffleHog 扫描精确新增/修改/删除内容"
      - "调用外部引擎（默认 codex）在隔离环境（空工作区 / safe-mode / --no-tools）审查"
      - "输出按严重度分级的审查发现"
      - "除非用户明确要求 push / ship / 更新 PR，否则不 push"

    must_not:
      - "跳过密钥扫描直接审查"
      - "把凭据注入到引擎环境"
      - "在用户未要求的情况下 push 或改动远端"

  - id: boundary-fail-closed-deleted-secret
    description: >
      扫描发现某整文件删除行中有疑似密钥，且该值同时出现在新增 / 上下文 / 混合暂存内容
      中。autoreview 必须 fail closed——拒绝本次审查，而不是就地打码后继续。

    must:
      - "识别『删除行中疑似密钥且其值也出现在其他新增/上下文内容』的情形"
      - "fail closed：中止审查并说明原因"
      - "说明这一保守策略是防止绕过密钥扫描的设计选择"

    must_not:
      - "在 fail-closed 情形下就地打码后继续审查"
      - "静默跳过被删除文件中的疑似密钥"

  - id: boundary-engine-unavailable
    description: >
      默认 Codex 引擎缺失（或失败），且无可用的 Claude / Pi 后备。autoreview 应明确报错，
      给出安装指引，绝不自动安装引擎，也不静默降级为无引擎审查。

    must:
      - "检测到引擎不可用时给出明确错误与安装/启用指引"
      - "给出可用的降级选项（换用 --engine claude / --engine pi，或 --no-engine 离线模式）"

    must_not:
      - "自动安装 codex / claude / pi / trufflehog"
      - "在用户不知情时静默跳过审查引擎"
