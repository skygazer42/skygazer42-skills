schema_version: 1

cases:
  - id: relentless-interview-one-at-a-time
    description: >
      拿到一个方案后，一次一个问题地走决策树，查事实、给推荐、
      达成共识前不行动。

    must:
      - "走决策树的分支，识别决策间依赖"
      - "一次只问一个问题，等回答再问下一个"
      - "每个问题给出推荐答案和理由"
      - "能查的事实自己查（不问用户）"
      - "达成共识后才路由到 writing-plans"

    must_not:
      - "一次抛出多个问题"
      - "问能自己 grep 的事实（如'用什么数据库'）"
      - "达成共识前开始写实现代码"

  - id: expose-hidden-gaps
    description: 拷问应逼出方案里没想清的漏洞，而非附和。

    must:
      - "挑战假设，逼出未定的决策"
      - "指出方案里藏着的漏洞或风险"

    must_not:
      - "附和用户的方案而不挑战"
      - "跳过有分歧的分支"
