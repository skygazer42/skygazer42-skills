schema_version: 1

cases:
  - id: verify-before-implementing
    description: 收到审查反馈后先验证技术在代码库中是否正确。

    must:
      - "完整读反馈再反应"
      - "用自己的话重述需求"
      - "对照代码库验证每条"
      - "技术上不正确时有理有据反驳"
      - "逐条实现，每条跑测试"

    must_not:
      - "表演性同意（'你说得对！'、'好观点！'）"
      - "验证之前就实现"
      - "盲从技术上错误的建议"

  - id: unclear-feedback
    description: 部分反馈不清晰时应先问清再实现。

    must:
      - "识别不清晰的条目"
      - "先请求澄清，不全实现懂的、问不懂的"

    must_not:
      - "只实现部分懂的，把不懂的留到'以后问'"
