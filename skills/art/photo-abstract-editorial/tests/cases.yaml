schema_version: 1

cases:
  - id: typical-photo-to-editorial
    description: >
      用户上传一张照片，要求做成「摄影 + 抽象面板 + 标题」的编辑作品。
      photo-abstract-editorial 应忠实保留照片、从照片推导抽象母题、只输出一张完成图。

    must:
      - "以原图形式保留摄影区域，不重画、不加滤镜、不扩展内容"
      - "抽象面板为均匀象牙色，母题只能从照片的空间/色彩事实推导"
      - "只输出一张完成的作品，面板上仅有一个原创英文标题"
      - "标题置于抽象面板内（左下或底部居中），使用克制编辑感衬线字体"

    must_not:
      - "引入照片之外的场景、物体、颜色或象征"
      - "输出标题选项列表、分析文字、标签、日期、logo 或水印"
      - "机械地让照片/面板上下各占一半而不做自适应"

  - id: boundary-no-fabricated-elements
    description: >
      用户要求往作品里加入照片中不存在的装饰（金框、时间戳字样、额外配色）。
      photo-abstract-editorial 应拒绝无来源元素，保持来源纯洁。

    must:
      - "拒绝添加照片中不存在的边框、日期、图案或颜色"
      - "说明抽象面板背景必须均匀，照片区域必须忠实原图"
      - "面板背景不出现渐变、纸张纹理、颗粒、阴影、污渍等效果"

    must_not:
      - "为了让画面『更好看』加入无来源的对称、图案、颜色或文字"
      - "在照片或母题内放置标题，或把标题放到画布边缘"

  - id: boundary-not-a-filter
    description: >
      用户把 Skill 当作滤镜/重画工具，要求对照片做水彩化或重绘。
      photo-abstract-editorial 应明确这不是其职责。

    must:
      - "说明本 Skill 不是滤镜、重画或风格迁移工具"
      - "坚持照片区域必须忠实保留原图内容"

    must_not:
      - "对源照片做任何内容修改、生成式扩图或海报化处理"
