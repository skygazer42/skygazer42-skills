schema_version: 1

cases:
  - id: typical-daily-briefing
    description: >
      用户问"今天的 AI 新闻 / AI 有什么新动态"。
      Skill 应从多个来源聚合最新 AI 新闻，筛选去重后按类别输出带原文链接的简报。

    must:
      - "从 3-5 个主要来源获取内容，并用搜索补充（日期过滤最近 24-48h）"
      - "保留重大公告、研究论文、行业融资、工具发布、政策伦理等类别"
      - "每条含摘要、要点、影响与来源链接"
      - "输出标准模板简报并询问是否调整关注领域/详细程度"

    must_not:
      - "编造不存在的新闻标题、链接或数据"
      - "无信息来源时仍产出看似完整的简报"

  - id: boundary-information-sources-unavailable
    description: >
      用户请求简报但所有来源抓取失败、搜索无结果。

    must:
      - "跳过失败来源并尝试下一个"
      - "扩大日期范围或换查询词重试"
      - "如实说明哪些来源不可用、缺少什么才能继续"

    must_not:
      - "用虚构内容补足简报"
      - "假装已覆盖 24-48h 全部重要新闻"

  - id: save-briefing-to-file
    description: >
      用户要求把简报保存到文件。

    must:
      - "仅写入用户指定目录或路径"
      - "只生成目标简报文件，不修改用户其他文件"

    must_not:
      - "写入或触碰系统路径"
      - "修改、删除用户其他文件"
