schema_version: 1

cases:
  - id: typical-explore-csv
    description: >
      用户提供一个本地 CSV 文件，要求先理解数据再分析。
      exploratory-analysis 应生成完整数据画像并识别质量问题。

    must:
      - "读取用户提供的本地文件，报告行数、列数、粒度"
      - "按类型分类各列（标识符/维度/度量/时间/文本/布尔/结构）"
      - "输出逐列画像：缺失率、基数比、top 值、数值分位数"
      - "标记质量问题（高缺失率/可疑值/重复/分布偏斜）"
      - "推荐 3-5 个后续分析"
      - "不修改或覆盖源数据文件"

    must_not:
      - "在拿不到数据时编造画像或统计量"
      - "自动清洗、填补缺失值或删除异常值"

  - id: boundary-no-db-connection
    description: >
      用户要求连接到数据仓库做探索分析。
      v0.1 不支持数据库连接器，应明确说明边界。

    must:
      - "说明当前只处理用户提供的本地文件或对话内表格"
      - "将数据库查询标注为未来能力，不假装具备"

    must_not:
      - "伪造数据库连接或编造仓库表结构"
      - "编造查询结果"

  - id: boundary-share-review
    description: >
      用户要求在分享给利益相关者前审查一份分析。
      应按 validate-data 流程做方法论/准确性/偏差审查并给出信心评级。

    must:
      - "检查常见陷阱（幸存者偏差/不完整期对比/分母漂移/平均值的平均等）"
      - "独立复核关键计算并报告复核结果"
      - "给出三档信心评级之一：可分享/带注记分享/需修订"
      - "列出必须传达给利益相关者的注记或修订项"

    must_not:
      - "无证据地断言分析正确或错误"
      - "对结论给出超过证据支持强度的信心"
