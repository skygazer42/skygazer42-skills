schema_version: 1

cases:
  - id: faithful-clone-with-verification
    description: >
      复刻一个网站时，走四步法（镜像/逆向/溯源移植/三重验证），
      核心是有线索按线索、没线索不瞎猜。

    must:
      - "完整镜像资产，补录 worker-fetch / 懒加载 / mobile 三类漏网资产"
      - "beautify 展开 bundle 逆向技术栈和私有格式"
      - "核心逻辑逐函数对照原产物移植，shader/常量逐字提取"
      - "源站死代码/错位赋值照抄，不'修正'"
      - "每里程碑全新加载 + 无头回归 + 量化像素比对"

    must_not:
      - "凭画面感觉猜关键数值（帧区间/相机参数/阈值）"
      - "手动切换效果来验收（掩盖初始化 bug）"
      - "目测像素代替脚本量化比对"
      - "'优化'或'修正'源站的死代码"

  - id: no-clue-do-not-guess
    description: >
      镜像里找不到某个实现的线索时，标记待查而非编造。

    must:
      - "回到 bundle/镜像里搜索线索"
      - "确实找不到时标记「待查」"

    must_not:
      - "编一个看起来合理的实现填进去"
      - "把猜测当成事实继续往下做"
