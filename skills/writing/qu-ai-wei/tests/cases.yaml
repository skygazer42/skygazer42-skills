schema_version: 1

cases:
  - id: typical-ai-text-de-ai
    description: >
      用户提供一段含典型简体中文 AI 写作模式的文本（时代开场、空洞强调、
      高频词如「赋能」「助力」），要求去 AI 味。qu-ai-wei 应识别命中模式、
      删空话、保留事实。

    must:
      - "门检判断为 AI 生成文本"
      - "识别命中的 AI 模式（如 #3 时代开场、#2 空洞强调、#7 高频词）"
      - "删除无法增加信息的背景、强调和口号"
      - "保留原文数字和具体动作"
      - "不补充原文没有的措施、效果或判断"

    must_not:
      - "在改写时添加原文没有的事实、人名、数字或引用"
      - "把文本降格为过于口语化的聊天风"
      - "对未命中的模式强行套用规则"

  - id: boundary-human-text
    description: >
      用户提供一段带有个人细节、自嘲和自然停顿的真人文本。
      qu-ai-wei 应在门检阶段判定为真人文本并停手。

    must:
      - "门检命中真人信号（自嘲、个人细节、自然破折号停顿等）"
      - "停手说明，不做改写"
      - "引用原文具体词句或结构作为证据"

    must_not:
      - "先把破折号、口语节奏或自嘲当成 AI 痕迹再改写"
      - "只凭「有破折号」「有第一人称」就判为 AI"

  - id: boundary-sensitive-credential
    description: >
      输入包含密码或 API key。qu-ai-wei 应立即停止，要求脱敏。

    must:
      - "检测到疑似凭证立即停止"
      - "回复：检测到疑似凭证，请删除或替换为 [REDACTED] 后重试"

    must_not:
      - "在回复中复述疑似凭证值"
      - "先掩码再继续处理"

  - id: embedded-mode-only-final
    description: >
      用户在更大工作流中以内嵌模式调用 qu-ai-wei，要求只输出终稿。
      应内部跑完整流程，外部只输出终稿正文。

    must:
      - "只输出终稿正文"
      - "内部仍运行门检、改写、自审、终稿完整流程"

    must_not:
      - "输出门检、初稿、自审、打磨报告或摘要"
      - "因为省略输出而降低改写质量"

  - id: register-academic-protection
    description: >
      学术技术文本中包含必要的「进行+V」、名词化和技术术语。
      qu-ai-wei 应保护学术语体，不降格为口语。

    must:
      - "按学术语体激活矩阵跳过 A、B、C、E、G、H 组"
      - "保留技术术语原文写法（如 latency、context window、token）"
      - "保留必要的被动句和名词化"

    must_not:
      - "为口语化制造新翻译腔（如把 latency 翻成「延迟时间」）"
      - "把学术语体降为聊天风"