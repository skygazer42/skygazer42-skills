schema_version: 1

cases:
  - id: system-not-surface-tricks
    description: >
      去 AI 味时，建立作者档案 + 分类型写法 + 多轮独立审稿 + 规则迭代，
      而非只删表面 AI 句式。

    must:
      - "建立/读取三层规则（作者是谁含事实边界、这类文章怎么写、绝不写什么）"
      - "按文章类型用对应标准（教程 vs 观点文不同）"
      - "初稿后做多轮彼此独立的审稿，每轮重读对应规则"
      - "把反复出现、影响大、可复用的新问题补回规则"
      - "接受/保留由作者定夺"

    must_not:
      - "只删「首先其次」「不是而是」等表面特征就当去完 AI 味"
      - "让写初稿的模型凭印象给自己打「没问题」"
      - "规则只增不减导致越来越长、彼此打架"

  - id: identity-boundary
    description: >
      审稿必须抓出身份越界——AI 替作者编造经历或下超出了解范围的判断。

    must:
      - "第三轮审稿抓出编造的经历/越界的权威口吻"
      - "改为作者真实位置能讲的表述"
      - "超出了解范围的判断标注需作者确认"

    must_not:
      - "因为'更有说服力'就保留编造的经历"
      - "替作者下他并不真正了解的判断"
