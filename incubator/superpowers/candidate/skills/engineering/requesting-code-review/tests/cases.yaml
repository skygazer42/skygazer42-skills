schema_version: 1

cases:
  - id: request-review-after-task
    description: 完成 task 后派发通用审查 + 领域审查。

    must:
      - "获取准确的 BASE/HEAD SHA"
      - "构造精确审查上下文"
      - "按严重度处理反馈（Critical 先修）"
      - "按领域路由到领域审查 Skill"

    must_not:
      - "跳过审查因为'太简单'"
      - "忽略 Critical 问题继续后续 task"

  - id: reviewer-is-wrong
    description: 审查反馈在技术上不正确时应有理有据地反驳。

    must:
      - "用技术推理和代码/测试证据反驳"
      - "请求澄清而非盲从"

    must_not:
      - "盲从技术上错误的反馈"
      - "情绪化反驳"
