schema_version: 1

cases:
  - id: three-independent-test-failures
    description: 3 个不同子系统的测试失败，根因独立，应并行派发 3 个代理。

    must:
      - "识别 3 个独立问题域"
      - "为每个域创建聚焦的代理任务"
      - "在同一响应中并发派发"
      - "审查返回结果并集成"

    must_not:
      - "串行派发（当问题独立时）"
      - "把独立问题合并成一个宽泛任务"

  - id: related-failures
    description: 失败可能相关时不应并行派发。

    must:
      - "识别失败可能共享根因"
      - "先一起调查而非并行派发"

    must_not:
      - "在可能相关时强制并行派发"
